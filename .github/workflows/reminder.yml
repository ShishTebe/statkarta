name: Напоминание о проверке актуальности

on:
  schedule:
    - cron: "0 3 1 1 *"
    - cron: "0 3 1 7 *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Создать задачу
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date +%d.%m.%Y)
          gh issue create \
            --title "Проверка актуальности карточек и справочников на $today" \
            --body-file data/legal/2026/actuality-checklist.md
